<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0d1a1e">
<title>پناهگاه</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg">
<style>
@font-face{font-family:PanahBrand;src:url(/static/PanahBrand.woff2?v=1) format("woff2");font-display:swap}
@font-face{font-family:Vazirmatn;src:local("Vazirmatn"),url(/static/Vazirmatn.woff2) format("woff2");font-display:swap}
:root{--bg:#0b161a;--p1:#102227;--p2:#162c32;--p3:#1e3a41;--line:#274349;--tx:#e8efe9;--mu:#82a0a3;--ac:#f0b252;--ac2:#ffd68f;--ink:#2a1f0a;--sand:#ecdcb6;--red:#ff7a6b;--ok:#6fd3a6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.65 Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{width:1.25em;height:1.25em;flex:none}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--p3);border-radius:8px}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:0;transition:border-color .15s}
input:focus,textarea:focus{border-color:var(--ac)}
.btn{background:var(--ac);color:var(--ink);font-weight:700;padding:10px 20px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:var(--p3);color:var(--tx)}.btn.danger{background:#4a2420;color:var(--red)}.btn.sm{padding:5px 12px;font-size:13px;border-radius:10px}
.icb{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mu);transition:.15s}.icb:hover{background:var(--p3);color:var(--tx)}

/* برند: نوشته‌ی Panahgah با فونت دست‌نویس (مثل لوگوی اینستاگرام) */
.brand{font-family:PanahBrand,"Brush Script MT","Segoe Script",cursive;font-weight:400;direction:ltr;unicode-bidi:isolate;display:inline-block;letter-spacing:.5px;line-height:1.15;
 background:linear-gradient(100deg,#ffe3ad 0%,#f0b252 45%,#e8872f 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;padding:2px 4px 6px;filter:drop-shadow(0 4px 14px #f0b25244)}
.bh{display:flex;align-items:baseline;gap:10px;min-width:0}.bh .brand{font-size:34px}.bh small{color:var(--mu);font-size:13px;font-weight:600}
.lcard .lg{display:block}.lcard h1.brand{display:block;font-size:50px;font-weight:400;letter-spacing:.5px;margin-bottom:2px}
/* login */
.login{height:100%;display:grid;place-items:center;padding:20px;background:radial-gradient(520px 420px at 50% 34%,#f0b25233,transparent 70%),var(--bg)}
.lcard{width:100%;max-width:380px;background:var(--p1);border:1px solid var(--line);border-radius:24px;padding:36px 28px;text-align:center}
.lcard .lg{width:84px;height:84px;margin:0 auto 14px;filter:drop-shadow(0 0 22px #f0b25288)}
.lcard h1{font-size:30px;font-weight:800;letter-spacing:-.3px}.lcard p{color:var(--mu);margin:4px 0 24px}
.lcard form{display:grid;gap:12px}.lcard input{text-align:center;direction:ltr}
.err{color:var(--red);font-size:13.5px;min-height:20px}

/* shell */
:root{--vvh:100dvh;--vvt:0px}
.app{display:flex;height:var(--vvh,100dvh);position:fixed;inset-inline:0;top:var(--vvt,0px);overflow:hidden}
.rail{width:76px;background:var(--p1);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
.rail .logo{width:44px;height:44px;margin-bottom:12px}
.rail button{position:relative;width:60px;padding:9px 0 6px;border-radius:14px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;transition:.15s}
.rail button svg{width:24px;height:24px}
.rail button:hover{color:var(--tx);background:var(--p2)}
.rail button.on{color:var(--ink);background:var(--ac)}
.rail .sp{flex:1}
.rail i{position:absolute;top:2px;inset-inline-start:6px;background:var(--red);color:#fff;font-style:normal;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#pages{flex:1;min-height:0;position:relative}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);min-height:0}

/* chat */
.chat{display:grid;grid-template-columns:350px minmax(0,1fr)}
.side{background:var(--p1);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;max-width:100%;overflow:hidden}
.sh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 18px 10px}.sh .btn{flex:none}
.sh h2{font-size:20px;font-weight:800}
#chatList{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding:4px 8px 12px}
.ci{display:flex;gap:12px;min-width:0;padding:10px;border-radius:14px;cursor:pointer;transition:background .12s}
.ci:hover{background:var(--p2)}.ci.on{background:var(--p3)}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none;color:#10201f}
.g0{background:#f0b252}.g1{background:#7fd1b9}.g2{background:#e89a8b}.g3{background:#a8c8f0}.g4{background:#c9b6ee}.g5{background:#d5d98a}
.ct{flex:1;min-width:0}.r1,.r2{display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0}
.r1 b{flex:1 1 auto;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.r1 time{font-size:12px;color:var(--mu);flex:none}
.r2 span{flex:1 1 auto;min-width:0;display:block;color:var(--mu);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r2 em{font-style:normal;background:var(--ac);color:var(--ink);font-weight:700;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 6px;flex:none}
.empty{color:var(--mu);text-align:center;padding:40px 24px;line-height:2}
.conv{display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(700px 400px at 70% 0,#f0b25210,transparent),var(--bg)}
#convBody{display:flex;flex-direction:column;flex:1;min-height:0}
.ch{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--p1);border-bottom:1px solid var(--line)}
.ch .t{flex:1;min-width:0;cursor:pointer}.ch b{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ch small{color:var(--mu)}.ch small.on{color:var(--ok)}
.back{display:none}
#msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;margin:12px 0 6px}.day span{background:var(--p2);color:var(--mu);font-size:12px;padding:3px 14px;border-radius:12px}
.more{align-self:center;margin-bottom:8px}
.msg{display:flex;flex-direction:column;max-width:min(80%,540px);position:relative;touch-action:pan-y}
.msg.mine{align-self:flex-start;align-items:flex-start}.msg.theirs{align-self:flex-end;align-items:flex-end}
.bub{position:relative;z-index:1;background:var(--p3);padding:7px 12px 5px;border-radius:18px;max-width:100%;cursor:pointer;transition:box-shadow .3s}
.mine .bub{background:var(--sand);color:var(--ink);border-start-start-radius:5px}
.theirs .bub{border-start-end-radius:5px}
.bub.del{opacity:.55;font-style:italic;display:flex;gap:6px;align-items:center;cursor:default;font-size:14px}
.msg.flash .bub{box-shadow:0 0 0 3px var(--ac)}
.txt{white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere}.txt a{color:inherit;text-decoration:underline}
.theirs .txt a{color:var(--ac2)}
.meta{float:left;font-size:11px;margin:6px 10px 0 0;direction:ltr;display:inline-flex;align-items:center;gap:4px}.meta .tm{opacity:.6}
.tk{display:inline-flex;align-items:center;vertical-align:middle}.tk svg{width:16px;height:16px;stroke-width:2.4}
.tk.t1,.tk.t2{opacity:.5}.tk.t3{color:#0a8a5b;opacity:1}.ci .tk{margin-inline-end:4px}.ci .tk.t3{color:var(--ok)}
.snd[data-un]{cursor:pointer}.snd[data-un]:hover{text-decoration:underline}
.ur.go{cursor:pointer;border-radius:12px;padding-inline:8px;transition:background .12s}.ur.go:hover{background:var(--p2)}.ur .cico{color:var(--mu);width:20px;height:20px}
.seen-l{display:grid;gap:2px}.seen-l h4{color:var(--ac2);margin:6px 0 2px}.seen-l div{padding:2px 0}.seen-l .no{color:var(--mu)}
.snd{font-size:13px;font-weight:800}.c0{color:#f0b252}.c1{color:#7fd1b9}.c2{color:#e89a8b}.c3{color:#a8c8f0}.c4{color:#c9b6ee}.c5{color:#d5d98a}
.quote{border-inline-start:3px solid var(--ac);background:#0003;border-radius:8px;padding:3px 9px;margin-bottom:5px;font-size:13px;cursor:pointer;display:flex;flex-direction:column}
.mine .quote{background:#0000001a;border-color:#8a5d0e}
.quote b{font-size:12.5px}.quote span{opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
.pic{max-width:100%;max-height:340px;min-width:140px;min-height:90px;border-radius:12px;display:block;margin-bottom:4px;cursor:zoom-in;object-fit:cover}
.bub video{width:min(380px,66vw);max-height:360px;border-radius:12px;display:block;margin-bottom:4px;background:#000}
.bub audio{width:min(270px,66vw);display:block;margin-bottom:4px}
.file{display:flex;align-items:center;gap:10px;padding:4px 0 6px;color:inherit;text-decoration:none}
.file .fi{width:42px;height:42px;border-radius:12px;background:var(--ac);color:var(--ink);display:grid;place-items:center}
.file b{display:block;font-size:14px;word-break:break-all}.file small{opacity:.65;direction:ltr;display:block;text-align:right}
.swi{position:absolute;top:50%;margin-top:-16px;width:32px;height:32px;border-radius:50%;background:var(--p3);color:var(--ac);display:grid;place-items:center;opacity:0;z-index:0;pointer-events:none;transition:background .12s,color .12s}
.swi svg{width:18px;height:18px}.swi.on{background:var(--ac);color:var(--ink)}
.qr{position:absolute;top:50%;margin-top:-16px;width:32px;height:32px;border-radius:50%;background:var(--p2);color:var(--mu);display:none;place-items:center;border:1px solid var(--line);z-index:2}
.qr::before{content:"";position:absolute;inset:-10px}
.qr svg{width:17px;height:17px}.qr:hover{color:var(--ink);background:var(--ac)}
.mine .qr{inset-inline-end:-40px}.theirs .qr{inset-inline-start:-40px}
@media(hover:hover) and (pointer:fine){.msg:hover .qr{display:grid}}
.rb div{cursor:pointer}
.acts{display:none;gap:6px;margin:4px 4px 2px}.sel .acts{display:flex}
.acts button{display:flex;align-items:center;gap:5px;font-size:12.5px;padding:3px 11px;border-radius:12px;background:var(--p2);color:var(--mu)}
.acts button:hover{color:var(--tx)}.acts .dng:hover{color:var(--red)}
.extras:empty{display:none}
.extras{padding:8px 14px 0;background:var(--p1);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.rb{display:flex;align-items:center;gap:10px;border-inline-start:3px solid var(--ac);background:var(--p2);border-radius:8px;padding:4px 12px}
.rb div{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px}.rb b{color:var(--ac)}.rb span{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{display:flex;align-items:center;gap:6px;background:var(--p3);border-radius:10px;padding:3px 6px 3px 10px;font-size:13px;max-width:220px}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:22px;background:var(--p2);border-radius:11px;position:relative;overflow:hidden;font-size:12px;display:grid;place-items:center}
.prog i{position:absolute;inset:0;width:0;background:var(--ac);opacity:.35;transition:width .2s}
.comp{display:flex;align-items:flex-end;gap:6px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--p1)}
.comp textarea{resize:none;max-height:140px;height:44px;border-radius:22px;padding:10px 18px;line-height:1.6}
.send{width:44px;height:44px;border-radius:50%;background:var(--ac);color:var(--ink);display:grid;place-items:center;flex:none}
.send svg{transform:scaleX(-1)}.send.mic svg{transform:none}
.av{position:relative}
.av.sm{width:38px;height:38px;font-size:15px}.av.lg{width:92px;height:92px;font-size:34px}
/* --- رفع مشکل نمایش عکس پروفایل (دایره‌ی ثابت در همه‌ی صفحه‌ها) --- */
.av,.ur .av,.mb .av,.ci .av,.ch .av{box-sizing:border-box;width:48px;height:48px;min-width:48px;min-height:48px;max-width:48px;max-height:48px;aspect-ratio:1/1;border-radius:50%;flex:none;overflow:visible;margin:0}
.av.sm,.ur .av.sm,.mb .av.sm{width:38px;height:38px;min-width:38px;min-height:38px;max-width:38px;max-height:38px}
.av.lg,.ur .av.lg,.mb .av.lg{width:92px;height:92px;min-width:92px;min-height:92px;max-width:92px;max-height:92px}
.av img,.mb .av img,.ur .av img{position:absolute;inset:0;width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;min-width:0!important;min-height:0!important;margin:0!important;border-radius:50%!important;object-fit:cover;display:block}
.dot{position:absolute;bottom:0;inset-inline-end:0;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2px solid var(--p1)}
.voice{display:flex;align-items:center;gap:8px}.voice .vi{width:36px;height:36px;border-radius:50%;background:var(--ac);color:var(--ink);display:grid;place-items:center;flex:none}
.voice audio{margin:0!important;width:min(230px,56vw)!important}
.recbar{display:none;align-items:center;gap:12px;flex:1;height:44px}.comp.recording>*:not(.recbar){display:none!important}.comp.recording .recbar{display:flex}
.recbar .sp{flex:1}.recbar .rd{width:12px;height:12px;border-radius:50%;background:var(--red);animation:pulse 1s infinite}
.recbar b{font-variant-numeric:tabular-nums;direction:ltr}
@keyframes pulse{50%{opacity:.25}}
.noconv{flex:1;display:grid;place-items:center;color:var(--mu);text-align:center;padding:20px}
.noconv svg{width:64px;height:64px;color:var(--ac);opacity:.7;margin-bottom:10px}

/* fun */
.fh{padding:14px 22px;background:var(--p1);border-bottom:1px solid var(--line)}
.fh .row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.fh .ttl{display:flex;align-items:center;gap:6px}
.fh h2{font-size:22px;font-weight:800}.fh .bh .brand{font-size:32px}
.fh .row>div{display:flex;gap:8px;align-items:center}.fh input{width:200px;padding:7px 14px;border-radius:20px}
/* hub: باکس‌های رنگی بخش سرگرمی */
.hub{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:20px;padding:20px 0 10px;max-width:960px;margin:0 auto}
.tile{position:relative;overflow:hidden;aspect-ratio:1/1;border-radius:32px;background:linear-gradient(145deg,var(--c1),var(--c2));color:#1b1406;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;padding:20px;text-align:start;box-shadow:0 16px 32px -18px var(--c2),inset 0 1px 0 #ffffff55;transition:transform .18s,box-shadow .18s}
.tile:hover{transform:translateY(-5px);box-shadow:0 22px 38px -16px var(--c2),inset 0 1px 0 #ffffff55}
.tile:active{transform:scale(.97)}
.tile .lg{position:relative;z-index:1;width:68px;height:68px;border-radius:22px;background:#ffffff3d;display:grid;place-items:center;box-shadow:inset 0 1px 0 #ffffff77,0 12px 22px -10px #0007}
.tile .lg svg{width:36px;height:36px;stroke-width:1.8;filter:drop-shadow(0 5px 5px #0003)}
.tile .gh{position:absolute;inset-inline-end:-26px;bottom:-30px;color:#fff;opacity:.2;pointer-events:none}
.tile .gh svg{width:170px;height:170px;stroke-width:1.1;transform:rotate(-14deg);filter:blur(1.2px)}
.tile .tx{position:relative;z-index:1}.tile b{display:block;font-size:21px;font-weight:800;line-height:1.4}.tile small{display:block;font-size:12.5px;opacity:.72;font-weight:600}
.by{display:block;color:var(--mu);font-size:12px;margin-top:1px}
.lks{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding-top:14px}
.lnk{display:flex;align-items:center;gap:12px;background:var(--p1);border:1px solid var(--line);border-radius:18px;padding:12px 14px;cursor:pointer;transition:background .12s,border-color .12s}
.lnk:hover{background:var(--p2);border-color:var(--p3)}
.lnk .li{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,#a8c8f0,#5b8fd6);color:#0f1d33;display:grid;place-items:center;flex:none;box-shadow:0 10px 18px -10px #5b8fd6}
.lnk .i{flex:1;min-width:0}.lnk .i b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk .i small{display:block;color:var(--mu);direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk .icb{width:34px;height:34px}.lnk .x{color:var(--red)}
.hint{color:var(--mu);font-size:13px;line-height:1.9}
#funList{flex:1;overflow-y:auto;padding:8px 22px 30px}
.sec{margin:10px 0;background:var(--p1);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.sec>.gt{width:100%;display:flex;align-items:center;gap:10px;padding:13px 16px;text-align:start;color:var(--ac2);font-size:15.5px;font-weight:700;transition:background .12s}
.sec>.gt:hover{background:var(--p2)}
.sec>.gt span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sec>.gt em{font-style:normal;font-size:12px;font-weight:700;color:var(--mu);background:var(--p3);border-radius:10px;padding:1px 10px;flex:none}
.sec>.gt svg{width:20px;height:20px;color:var(--mu);transition:transform .2s;transform:rotate(90deg)}
.sec.open>.gt svg{transform:rotate(-90deg)}
.sec.open>.gt{border-bottom:1px solid var(--line)}
.sec>.gb{padding:8px 8px 12px}
.trk{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:14px;cursor:pointer}
.trk:hover{background:var(--p2)}.trk.on{background:var(--p3)}
.trk .pl{width:42px;height:42px;border-radius:12px;background:var(--p3);display:grid;place-items:center;color:var(--ac);flex:none}
.trk.on .pl{background:var(--ac);color:var(--ink)}
.trk div.i{flex:1;min-width:0}.trk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trk small{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.card{position:relative;cursor:pointer}
.card .th{aspect-ratio:3/4;border-radius:16px;display:grid;place-items:center;color:#0009;overflow:hidden;transition:transform .15s}
.card:hover .th{transform:translateY(-3px)}
.card.v .th{aspect-ratio:16/10}
.card .th svg{width:46px;height:46px;opacity:.75}
.card b{display:block;margin-top:8px;font-size:14px;line-height:1.5;font-weight:600}.card small{color:var(--mu)}
.card .x,.trk .x{color:var(--red)}
.card .x{position:absolute;top:8px;inset-inline-start:8px;background:#000a;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.player{background:var(--p1);border-top:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:14px;direction:ltr}
.player .pi{min-width:0;width:200px;direction:rtl}.player .pi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player .pi small{color:var(--mu)}
.player .ctl{display:flex;align-items:center;gap:2px}
.player .tg{width:46px;height:46px;border-radius:50%;background:var(--ac);color:var(--ink);display:grid;place-items:center}
.player .ctl .icb{width:38px;height:38px}
.player .sk{flex:1;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--mu);min-width:0}
.player input[type=range]{flex:1;accent-color:var(--ac);min-width:0;height:28px;cursor:pointer;touch-action:pan-y}
.player .spd{font-size:13px;font-weight:700;color:var(--ac2);width:46px}

/* admin */

const MRE=/(https?:\/\/[^\s<]+)|(^|[^A-Za-z0-9_])@([A-Za-z0-9_]+(?:\.[A-Za-z0-9_]+)*)/g;
function rich(m){const set=new Set(m.mentions||[]),mine=(S.me.username||'').toLowerCase();
 return esc(m.text).replace(MRE,(all,url,pre,un)=>{if(url)return`<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
  const l=un.toLowerCase();return set.has(l)?`${pre}<span class="mention${l===mine?' me':''}" data-mn="${un}">@${un}</span>`:all})}
function fileHtml(f){const t=f.mime||'',u=esc(f.url);
 if(t.startsWith('image/')&&t!=='image/svg+xml')return`<img class="pic" loading="lazy" src="${u}" data-lb="${u}" alt="">`;
 if(t.startsWith('video/'))return`<video controls preload="metadata" playsinline src="${u}"></video>`;
 if(t.startsWith('audio/'))return(f.name||'').startsWith('voice-')?`<div class="voice"><span class="vi">${ic('mic')}</span><audio controls preload="none" src="${u}"></audio></div>`:`<audio controls preload="none" src="${u}"></audio>`;
 return`<a class="file" href="${u}${t==='application/pdf'?'" target="_blank':'?dl=1" download="'}"><span class="fi">${ic('file')}</span><span><b>${esc(f.name)}</b><small>${fmtSize(f.size)}</small></span></a>`}
function mergeNew(list,notify){let added=false,others=false;

  if(m.id<S.last)return;S.msgs.push(m);S.last=Math.max(S.last,m.id);addMsg(m);added=true;if(m.uid!==S.me.id)others=true});

(()=>{const box=$('#msgs'),TH=64,MAX=96;let g=null;

  bub.style.transition='transform .2s ease';bub.style.transform='';icon.style.transition='opacity .2s';icon.style.opacity=0;
  setTimeout(()=>{bub.style.transition='';icon.remove()},220);S.swBlock=Date.now()+350;if(ok&&hit)act('reply',id)};

   if(a<12||a<Math.abs(dy)*1.5)return;
   g.locked=true;g.dir=dx>0?1:-1;g.bub.style.transition='none';
   const ic2=document.createElement('span');ic2.className='swi';ic2.innerHTML=ic('reply');ic2.style[g.dir>0?'left':'right']='4px';g.msg.prepend(ic2);g.icon=ic2;
   try{box.setPointerCapture(e.pointerId)}catch(_){}}
  const d=g.dir*dx;if(d<=0){g.bub.style.transform='';g.icon.style.opacity=0;g.hit=false;return}
  const off=Math.min(MAX,d<=TH?d:TH+(d-TH)*.3),pr=Math.min(1,d/TH);
  g.bub.style.transform=`translateX(${g.dir*off}px)`;g.icon.style.opacity=pr;g.icon.style.transform=`scale(${.6+.4*pr})`;
  const hit=d>=TH;if(hit!==g.hit){g.hit=hit;g.icon.classList.toggle('on',hit);if(hit&&navigator.vibrate)navigator.vibrate(12)}});

/* player */
const auP=$('#au');
function playIdx(i){const it=S.q[i];if(!it)return;S.qi=i;S.cur=it;auP.src=it.url;auP.playbackRate=S.rate||1;auP.play().catch(()=>{});
 $('#player').classList.remove('hidden');$('#pT').textContent=it.title;$('#pS').textContent=it.collection||(CATS[it.cat]||{}).n||'';
 if('mediaSession' in navigator)try{navigator.mediaSession.metadata=new MediaMetadata({title:it.title,artist:it.collection||'پناهگاه'});navigator.mediaSession.setActionHandler('nexttrack',()=>playIdx(S.qi+1));navigator.mediaSession.setActionHandler('previoustrack',()=>playIdx(S.qi-1));
  const ms=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  ms('seekbackward',d=>seekBy(-(d&&d.seekOffset||10)));ms('seekforward',d=>seekBy(d&&d.seekOffset||10));
  ms('seekto',d=>{if(d&&isFinite(d.seekTime))auP.currentTime=d.seekTime});ms('play',()=>auP.play());ms('pause',()=>auP.pause())}catch(e){}
 renderMedia()}
function stopPlayer(){auP.pause();auP.removeAttribute('src');auP.load();S.cur=null;$('#player').classList.add('hidden');renderMedia()}
$('#pTog').onclick=()=>auP.paused?auP.play():auP.pause();$('#pNext').onclick=()=>playIdx(S.qi+1);$('#pPrev').onclick=()=>auP.currentTime>4?auP.currentTime=0:playIdx(S.qi-1);$('#pX').onclick=stopPlayer;
$('#pSpd').onclick=()=>{const r=[1,1.25,1.5,2],n=r[(r.indexOf(S.rate||1)+1)%r.length];S.rate=n;auP.playbackRate=n;$('#pSpd').textContent=n+'×'};
auP.onplay=auP.onpause=()=>{$('#pTog').innerHTML=ic(auP.paused?'play':'pause');if($('#pgFun').offsetParent&&isMedia())renderMedia()};
auP.onended=()=>{if(S.qi<S.q.length-1)playIdx(S.qi+1)};
auP.onerror=()=>{if(S.cur)toast('پخش این فایل ممکن نیست',1)};
auP.ontimeupdate=()=>{if(!seeking&&isFinite(auP.duration)&&auP.duration){$('#pR').value=auP.currentTime/auP.duration*1000;$('#pC').textContent=fmtDur(auP.currentTime);posState()}};
function posState(){if(!('mediaSession' in navigator)||!navigator.mediaSession.setPositionState||!isFinite(auP.duration)||!auP.duration)return;
 try{navigator.mediaSession.setPositionState({duration:auP.duration,playbackRate:auP.playbackRate||1,position:Math.min(auP.currentTime,auP.duration)})}catch(e){}}
function seekBy(d){if(!S.cur||!isFinite(auP.duration))return;auP.currentTime=Math.max(0,Math.min(auP.duration,auP.currentTime+d))}
$('#pBk').onclick=()=>seekBy(-10);$('#pFw').onclick=()=>seekBy(10);
auP.onloadedmetadata=auP.ondurationchange=()=>{$('#pD').textContent=isFinite(auP.duration)?fmtDur(auP.duration):'0:00';posState()};
let seeking=false;const pr=$('#pR');pr.oninput=()=>{seeking=true;if(isFinite(auP.duration)&&auP.duration)$('#pC').textContent=fmtDur(pr.value/1000*auP.duration)};
const seekCommit=()=>{if(isFinite(auP.duration)&&auP.duration)auP.currentTime=pr.value/1000*auP.duration;seeking=false};
pr.onchange=seekCommit;pr.addEventListener('touchend',()=>setTimeout(()=>{if(seeking)seekCommit()},0),{passive:true});
$('#pTog').innerHTML=ic('play');btns();

/* ---------- admin ---------- */
async function loadAdmin(){try{const own=S.me.is_owner;const r=await Promise.all([api('/api/admin/users'),own?api('/api/admin/groups'):{groups:[]},own?api('/api/owner/storage'):null,own?api('/api/admin/channels'):{channels:[]}]);S.users=r[0].users;S.groups=r[1].groups;S.st=r[2];S.channels=r[3].channels;renderAdmin()}catch(e){toast(e.message,1)}}
const rpw=()=>{const c='abcdefghjkmnpqrstuvwxyz23456789';return Array.from(crypto.getRandomValues(new Uint8Array(9)),x=>c[x%c.length]).join('')};
const checks=sel=>S.users.map(u=>`<label class="chk"><input type="checkbox" value="${u.id}" ${sel.includes(u.id)||u.id===S.me.id?'checked':''} ${u.id===S.me.id?'disabled':''}>${esc(u.name)}</label>`).join('');
const roleSel=(id,cur,own)=>`<select id="${id}">${['member','uploader',...(own?['admin']:[])].map(r=>`<option value="${r}" ${r===cur?'selected':''}>${RN[r]}${r==='uploader'?' (آپلود در سرگرمی)':''}</option>`).join('')}</select>`;
const chanRows=(mem,pos,pre)=>`<div class="cbox" id="${pre}"><div class="crow hd"><span>کاربر</span><span>عضو</span><span>پیام‌دهنده</span></div>${S.users.map(u=>{const me_=u.id===S.me.id,isM=me_||mem.includes(u.id),isP=me_||pos.includes(u.id);return`<div class="crow" data-u="${u.id}"><span>${esc(u.name)} <small style="color:var(--mu)">@${esc(u.username)}</small></span><label><input type="checkbox" data-k="m" ${isM?'checked':''} ${me_?'disabled':''}></label><label><input type="checkbox" data-k="p" ${isP?'checked':''} ${me_?'disabled':''}></label></div>`}).join('')}</div>`;
const chanPick=el=>{const m=[],p=[];$$('.crow[data-u]',el).forEach(r=>{const id=+r.dataset.u;if($('[data-k=m]',r).checked)m.push(id);if($('[data-k=p]',r).checked)p.push(id)});return{members:m,posters:p}};
const chanSync=el=>el.addEventListener('change',e=>{const r=e.target.closest('.crow[data-u]');if(!r)return;const m=$('[data-k=m]',r),p=$('[data-k=p]',r);if(e.target===p&&p.checked)m.checked=true;if(e.target===m&&!m.checked)p.checked=false});
const sz=b=>b?fmtSize(b):'۰';
function stHtml(){const d=S.st,du=d.disk,pct=Math.round(du.used/du.total*100),low=du.free<du.min_free,t=d.settings;
 const num=(id,l,v)=>`<label>${l}<input type="number" min="0" id="${id}" value="${v}"></label>`;
 return`<div class="box2 full" id="stbox"><h3>مدیریت فضا</h3>
 <div class="bar"><i class="${low?'low':pct>80?'warn':''}" style="width:${pct}%"></i></div>
 <div class="stats"><span>کل: ${sz(du.total)}</span><span>مصرف‌شده: ${sz(du.used)} (${pct}٪)</span><span class="${low?'bad':''}">آزاد: ${sz(du.free)}</span><span>حداقل آزاد برای اجازه‌ی آپلود: ${sz(du.min_free)}</span></div>
 ${low?'<div class="alert">فضای آزاد کمتر از حد مجاز است و آپلود در همه‌ی بخش‌ها بسته شده. فایل‌های قدیمی را پاک کن.</div>':''}
 <div class="stats"><span>فایل‌های چت: ${sz(d.bytes.chat)}</span><span>سرگرمی: ${sz(d.bytes.media)}</span><span>عکس‌های پروفایل: ${sz(d.bytes.avatar)}</span><span>دیتابیس: ${sz(d.bytes.db)}</span></div>
 <div class="tools"><span>پاک‌سازی فایل‌های چت قدیمی‌تر از</span><input type="number" min="1" id="pdays" value="30"><span>روز</span><button class="btn danger sm" data-purge="old">پاک کن</button>
  <button class="btn ghost sm" data-purge="maint">بهینه‌سازی (فایل‌های اضافه + دیتابیس)</button></div>
 <div class="frm sets">${num('s1','حداکثر حجم هر فایل در چت (MB)',t.chat_file_mb)}${num('s2','سهمیه‌ی فایل چت هر کاربر (MB)',t.quota_mb)}${num('s3','حداکثر حجم هر فایل سرگرمی (MB)',t.media_file_mb)}${num('s4','سهمیه‌ی آپلود سرگرمی کاربر سطح ۲ (MB)',t.media_quota_mb)}
  ${num('s5','حذف خودکار فایل‌های چت قدیمی‌تر از (روز؛ ۰ = خاموش)',t.retention_days)}<label class="chk"><input type="checkbox" id="s6" ${t.emergency_purge?'checked':''}>پاک‌سازی اضطراری خودکار فایل‌های چت (قدیمی‌ترین‌ها) وقتی فضا کم شد</label>
  <button class="btn" data-purge="save" style="grid-column:1/-1">ذخیره‌ی تنظیمات</button></div>
 <div class="two-col"><div><h4>مصرف کاربران</h4>${d.users.map(u=>`<div class="ur"><div>${esc(u.name)}<small style="direction:rtl">چت ${sz(u.chat)} · سرگرمی ${sz(u.media)}</small></div>${u.chat?`<button class="btn danger sm" data-purge="user" data-id="${u.id}">حذف فایل‌های چت</button>`:''}</div>`).join('')}</div>
 <div><h4>گروه‌ها</h4>${d.groups.map(g=>`<div class="ur"><div>${esc(g.name)}<small style="direction:rtl">${sz(g.bytes)} فایل · ${g.count} پیام</small></div><button class="btn danger sm" data-purge="group" data-id="${g.id}">خالی کردن تاریخچه</button></div>`).join('')||'<div class="empty" style="padding:8px">گروهی نیست</div>'}
 <div class="ur"><div>گفتگوهای خصوصی<small style="direction:rtl">${sz(d.dm_bytes)} فایل</small></div></div></div></div></div>`}
/* انتخاب عکس پروفایل برای گروه/کانال (داخل مودال) */
const avPickHtml=pre=>`<div class="pf"><div class="av lg g0" id="${pre}av"></div><div class="pfb"><button type="button" class="btn ghost sm" id="${pre}pick">${ic('cam')} انتخاب عکس</button><button type="button" class="btn danger sm hidden" id="${pre}rm">حذف عکس</button></div><input type="file" id="${pre}f" accept="image/*" class="hidden"></div>`;
function avPick(m,pre,id,url){const st={blob:null,rm:false,prev:'',url:url||''},av=$('#'+pre+'av',m);av.className='av lg g'+(id%6);
 const paint=()=>{const u=st.blob?st.prev:(st.rm?'':st.url);av.innerHTML=u?`<img src="${esc(u)}" alt="">`:esc(initial(($('#'+pre+'n',m)||{}).value||'؟'));$('#'+pre+'rm',m).classList.toggle('hidden',!u)};
 $('#'+pre+'pick',m).onclick=()=>$('#'+pre+'f',m).click();
 $('#'+pre+'f',m).onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{st.blob=await squareJpeg(f,320);if(st.prev)URL.revokeObjectURL(st.prev);st.prev=URL.createObjectURL(st.blob);st.rm=false;paint()}catch(x){toast(x.message,1)}};
 $('#'+pre+'rm',m).onclick=()=>{st.blob=null;st.rm=true;paint()};
 const nm=$('#'+pre+'n',m);if(nm)nm.addEventListener('input',()=>{if(!st.blob&&(st.rm||!st.url))paint()});
 paint();return st}
async function saveChatAv(cid,st){if(st.blob){const fd=new FormData();fd.append('file',st.blob,'a.jpg');await upload(`/api/admin/chats/${cid}/avatar`,fd)}else if(st.rm)await api(`/api/admin/chats/${cid}/avatar`,{method:'DELETE'})}

  if(b.dataset.purge){const k=b.dataset.purge,gv=id=>+$('#'+id).value||0;
   try{if(k==='save'){await api('/api/owner/settings',{method:'PUT',json:{chat_file_mb:gv('s1'),quota_mb:gv('s2'),media_file_mb:gv('s3'),media_quota_mb:gv('s4'),retention_days:gv('s5'),emergency_purge:$('#s6').checked?1:0}});toast('تنظیمات ذخیره شد');loadAdmin()}
   else if(k==='old'){const dd=gv('pdays');if(!confirm(`فایل‌های چت قدیمی‌تر از ${dd} روز پاک شوند؟ متن پیام‌ها می‌ماند.`))return;const r=await api('/api/owner/purge-files',{json:{days:dd}});toast(`${r.count} فایل پاک شد — ${fmtSize(r.freed)||'۰'} آزاد شد`);loadAdmin()}
   else if(k==='maint'){b.disabled=true;const r=await api('/api/owner/maintenance',{method:'POST'});toast(`${fmtSize(r.freed)||'۰'} آزاد شد`);loadAdmin()}
   else if(k==='user'){if(!confirm('همه‌ی فایل‌های چت این کاربر پاک شود؟ متن پیام‌ها می‌ماند.'))return;const r=await api('/api/owner/purge-user',{json:{user_id:+b.dataset.id}});toast(`${fmtSize(r.freed)||'۰'} آزاد شد`);loadAdmin()}
   else if(k==='group')clearHist(+b.dataset.id)}catch(x){toast(x.message,1);b.disabled=false}return}
  if(b.dataset.du){const u=S.users.find(x=>x.id==b.dataset.du);if(confirm(`«${u.name}» و همه پیام‌هایش حذف شود؟`)){try{await api('/api/admin/users/'+u.id,{method:'DELETE'});loadAdmin()}catch(x){toast(x.message,1)}}}
  if(b.dataset.dg&&confirm('گروه و همه پیام‌هایش حذف شود؟')){try{await api('/api/admin/groups/'+b.dataset.dg,{method:'DELETE'});loadAdmin()}catch(x){toast(x.message,1)}}
  if(b.dataset.eu){const u=S.users.find(x=>x.id==b.dataset.eu);const canRole=u.role!=='owner'&&u.id!==S.me.id&&(own||['member','uploader'].includes(u.role));const m=modal(`<h3>ویرایش ${esc(u.username)}</h3><input type="text" id="en" value="${esc(u.name)}"><div class="pwrow"><input type="text" id="ep" placeholder="رمز جدید (خالی = بدون تغییر)" dir="ltr"><button class="btn ghost" id="eg">تولید</button></div>
   ${canRole?roleSel('er',u.role,own):''}<div class="acts2"><button class="btn" id="es">ذخیره</button></div>`);
   $('#eg',m).onclick=()=>$('#ep',m).value=rpw();
   $('#es',m).onclick=async()=>{const pw=$('#ep',m).value;try{await api('/api/admin/users/'+u.id,{method:'PUT',json:{name:$('#en',m).value,password:pw,role:$('#er',m)?.value}});closeModal();toast(pw?'ذخیره شد. رمز جدید: '+pw:'ذخیره شد');loadAdmin()}catch(x){toast(x.message,1)}}}
  if(b.dataset.eg){const g=S.groups.find(x=>x.id==b.dataset.eg);if(g)groupModal(g)}}}

/* ---------- boot ---------- */
api('/api/me').then(d=>{S.me=d.user;start()}).catch(()=>showLogin());

/* ---- keyboard / visual viewport (موبایل) ---- */
(function(){
 const R=document.documentElement,vv=window.visualViewport;
 const isEd=el=>el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!['checkbox','radio','range','file','button','submit'].includes(el.type))||el.isContentEditable);
 let base=0,raf=0;
 const mobile=()=>matchMedia('(max-width:820px)').matches||matchMedia('(pointer:coarse)').matches;
 function apply(){
  raf=0;
  const h=vv?vv.height:innerHeight,top=vv?vv.offsetTop:0;
  base=Math.max(base,innerHeight,h);
  const shrunk=base-h>120;
  const kb=mobile()&&shrunk&&isEd(document.activeElement);
  R.classList.toggle('kb',kb);
  R.style.setProperty('--vvh',h+'px');
  R.style.setProperty('--vvt',top+'px');
  R.style.setProperty('--vvb',Math.max(0,innerHeight-h-top)+'px');
  if(window.scrollY||document.body.scrollTop)scrollTo(0,0);
  if(kb){
   const m=document.getElementById('msgs');
   if(m&&S&&S.stick)m.scrollTop=m.scrollHeight;
   const a=document.activeElement;
   if(a&&a.id!=='ta'&&a.scrollIntoView)a.scrollIntoView({block:'nearest'});
  }
 }
 const sched=()=>{if(!raf)raf=requestAnimationFrame(apply)};
 if(vv){vv.addEventListener('resize',sched);vv.addEventListener('scroll',sched)}
 addEventListener('resize',()=>{if(!isEd(document.activeElement))base=innerHeight;sched()});
 addEventListener('orientationchange',()=>{base=0;setTimeout(sched,300)});
 addEventListener('scroll',()=>{if(scrollY)scrollTo(0,0)});
 document.addEventListener('focusin',e=>{if(isEd(e.target)){sched();setTimeout(sched,120);setTimeout(sched,350);setTimeout(sched,700)}});
 document.addEventListener('focusout',()=>{setTimeout(()=>{if(!isEd(document.activeElement)){R.classList.remove('kb');sched()}},60)});
 sched();
})();
</script>
</body>
